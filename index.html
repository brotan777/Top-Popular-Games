<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Popular Games & Aibek Exchange</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --success: #22c55e;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 8px;
            color: var(--accent);
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .balance-box {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            color: var(--success);
            margin-bottom: 12px;
        }
        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .cell {
            aspect-ratio: 1;
            background-color: #334155;
            border: none;
            border-radius: 8px;
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: centre;
            justify-content: center;
            cursor: pointer;
        }
        .cell:active {
            background-color: #475569;
        }
        .selector {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .selector button {
            flex: 1;
            padding: 8px;
            font-size: 1.2rem;
            background: #334155;
            color: white;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
        }
        .selector button.selected {
            border-color: var(--accent);
            background: #1e293b;
        }
        .exchange-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        input, select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }
        .status {
            text-align: center;
            font-size: 0.95rem;
            margin-top: 8px;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Top Popular Games & Aibek</h1>

        <!-- Баланс -->
        <div class="card">
            <div class="balance-box">Баланс: <span id="balance">500</span> AJ</div>
        </div>

        <!-- Хрестики-нулики з ШІ -->
        <div class="card">
            <h2 style="font-size: 1.2rem; margin-top:0; text-align:center;">Хрестики-нулики з ШІ</h2>
            <div class="selector">
                <button id="btnX" class="selected" onclick="chooseSymbol('X')">❌ Грати хрестиками</button>
                <button id="btnO" onclick="chooseSymbol('O')">⭕ Грати ноликами</button>
            </div>
            <button class="btn" onclick="startGame()">Розпочати гру</button>
            
            <div class="status" id="gameStatus">Оберіть фігуру та натисніть «Розпочати гру»</div>
            
            <div class="board" id="board">
                <button class="cell" onclick="makeMove(0)"></button>
                <button class="cell" onclick="makeMove(1)"></button>
                <button class="cell" onclick="makeMove(2)"></button>
                <button class="cell" onclick="makeMove(3)"></button>
                <button class="cell" onclick="makeMove(4)"></button>
                <button class="cell" onclick="makeMove(5)"></button>
                <button class="cell" onclick="makeMove(6)"></button>
                <button class="cell" onclick="makeMove(7)"></button>
                <button class="cell" onclick="makeMove(8)"></button>
            </div>
        </div>

        <!-- Біржа валюти Айбек -->
        <div class="card exchange-section">
            <h2 style="font-size: 1.2rem; margin-top:0; text-align:center;">Біржа валюти «Айбек»</h2>
            <label for="amount">Сума в AJ:</label>
            <input type="number" id="amount" value="100" min="1">
            
            <label for="currency">Оберіть валюту:</label>
            <select id="currency">
                <option value="USDT">USDT (Долар США)</option>
                <option value="UAH">UAH (Українська гривня)</option>
                <option value="EUR">EUR (Євро)</option>
                <option value="GBP">GBP (Британський фунт)</option>
                <option value="PLN">PLN (Польський злотий)</option>
                <option value="JPY">JPY (Японська єна)</option>
                <option value="CAD">CAD (Канадський долар)</option>
                <option value="AUD">AUD (Австралійський долар)</option>
                <option value="CHF">CHF (Швейцарський франк)</option>
            </select>

            <button class="btn" onclick="exchangeCurrency()">Обміняти AJ</button>
            <div class="status" id="exchangeResult"></div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 500;
        let playerSymbol = 'X';
        let aiSymbol = 'O';
        let board = ['', '', '', '', '', '', '', '', ''];
        let gameActive = false;
        let isPlayerTurn = true;

        // Курси валют відносно AJ (Айбек-койна)
        const rates = {
            USDT: 0.05,
            UAH: 2.0,
            EUR: 0.045,
            GBP: 0.04,
            PLN: 0.20,
            JPY: 7.5,
            CAD: 0.07,
            AUD: 0.075,
            CHF: 0.042
        };

        function chooseSymbol(symbol) {
            playerSymbol = symbol;
            aiSymbol = symbol === 'X' ? 'O' : 'X';
            document.getElementById('btnX').classList.toggle('selected', symbol === 'X');
            document.getElementById('btnO').classList.toggle('selected', symbol === 'O');
        }

        function startGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            isPlayerTurn = (playerSymbol === 'X');
            updateBoardUI();
            
            if (!isPlayerTurn) {
                document.getElementById('gameStatus').innerText = "ШІ ходить першим...";
                setTimeout(aiMove, 600);
            } else {
                document.getElementById('gameStatus').innerText = "Ваш хід!";
            }
        }

        function makeMove(index) {
            if (!gameActive || !isPlayerTurn || board[index] !== '') return;

            board[index] = playerSymbol;
            updateBoardUI();

            if (checkWin(playerSymbol)) {
                endGame(true, "Ви перемогли! Нагороджено +50 AJ 🎉");
                balance += 50;
                updateBalance();
                return;
            }

            if (board.every(cell => cell !== '')) {
                endGame(false, "Нічия!");
                return;
            }

            isPlayerTurn = false;
            document.getElementById('gameStatus').innerText = "ШІ думає...";
            setTimeout(aiMove, 600);
        }

        function aiMove() {
            if (!gameActive) return;

            let emptyCells = [];
            board.forEach((val, idx) => {
                if (val === '') emptyCells.push(idx);
            });

            if (emptyCells.length === 0) return;

            // ШІ з невеликим шансом на помилку або розумним ходом
            let chosenCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            
            // Спробуємо знайти виграшний хід для ШІ або заблокувати гравця (простий інтелект)
            for (let cell of emptyCells) {
                board[cell] = aiSymbol;
                if (checkWin(aiSymbol)) {
                    chosenCell = cell;
                    board[cell] = '';
                    break;
                }
                board[cell] = '';
            }

            board[chosenCell] = aiSymbol;
            updateBoardUI();

            if (checkWin(aiSymbol)) {
                endGame(false, "ШІ переміг! Спробуйте ще раз 💪");
                return;
            }

            if (board.every(cell => cell !== '')) {
                endGame(false, "Нічия!");
                return;
            }

            isPlayerTurn = true;
            document.getElementById('gameStatus').innerText = "Ваш хід!";
        }

        function checkWin(symbol) {
            const winCombos = [
                [0,1,2], [3,4,5], [6,7,8], // ряди
                [0,3,6], [1,4,7], [2,5,8], // колонки
                [0,4,8], [2,4,6]           // діагоналі
            ];
            return winCombos.some(combo => {
                return combo.every(idx => board[idx] === symbol);
            });
        }

        function endGame(won, message) {
            gameActive = false;
            document.getElementById('gameStatus').innerText = message;
        }

        function updateBoardUI() {
            let cells = document.getElementsByClassName('cell');
            for (let i = 0; i < cells.length; i++) {
                cells[i].innerText = board[i];
            }
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance;
        }

        function exchangeCurrency() {
            let amount = parseFloat(document.getElementById('amount').value);
            let currency = document.getElementById('currency').value;
            let resultDiv = document.getElementById('exchangeResult');

            if (isNaN(amount) || amount <= 0) {
                resultDiv.style.color = "var(--danger)";
                resultDiv.innerText = "Введіть коректну суму!";
                return;
            }

            if (amount > balance) {
                resultDiv.style.color = "var(--danger)";
                resultDiv.innerText = "Недостатньо коштів на балансі!";
                return;
            }

            balance -= amount;
            updateBalance();

            let converted = (amount * rates[currency]).toFixed(2);
            resultDiv.style.color = "var(--success)";
            resultDiv.innerText = `Успішно обміняно ${amount} AJ на ${converted} ${currency}!`;
        }
    </script>
</body>
</html>
